name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@main
    with:
      nimble-bin-path: true
      test-command: |
        nimble test_asan
        nimble test
        bash tests/scripts/tests.sh
